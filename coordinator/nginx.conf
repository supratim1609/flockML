events {
    worker_connections 1024;
}

http {
    # CERT-In Rate Limiting Zones to protect against DoS attacks
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream coordinator_backend {
        server coordinator:8080;
    }

    server {
        listen 80;
        server_name _;

        # Redirect HTTP to HTTPS (HSTS enforcement)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # CERT-In / MeitY Mandatory Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self' wss: https:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # WebSocket Reverse Proxy with Rate Limiting
        location /ws {
            limit_req zone=ws_limit burst=30 nodelay;

            proxy_pass http://coordinator_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400; # Keep WS connection open for 24h
        }

        # REST Telemetry APIs with Rate Limiting
        location / {
            limit_req zone=api_limit burst=15 nodelay;

            proxy_pass http://coordinator_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
